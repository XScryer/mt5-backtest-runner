[Common]
Login=12345678
Server=YourBroker-Live
ProxyEnable=0

[Tester]
Expert=MyBot
; the .set staged next to this file, copied to MQL5\Profiles\Tester\
ExpertParameters=mybot-eurusd-m15.set
Symbol=EURUSD
Period=M15
; ALWAYS numeric codes: 0=every tick (simulated), 1=1min OHLC, 2=open prices,
; 3=math only, 4=every tick based on real ticks. UI names like "real ticks"
; are silently ignored on some builds -> simulated ticks with no error.
Model=4
FromDate=2025.01.01
ToDate=2026.01.01
Optimization=0
Deposit=1000
Currency=USD
Leverage=30
Visual=0
UseLocal=1
; report path WITHOUT extension - MT5 appends .htm (or .xml if it ends in .xml)
Report=reports\mybot-eurusd-m15
ReplaceReport=1
; lets the runner close the terminal when the test ends
ShutdownTerminal=1
