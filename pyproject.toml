[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-backtest-runner"
version = "0.1.0"
description = "Command-line batch runner for the MetaTrader 5 Strategy Tester — queue .ini configs, stage .set parameters, collect results"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "XScryer" }]
keywords = ["metatrader5", "mt5", "backtest", "strategy-tester", "mql5", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Zero runtime dependencies — stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mt5-runner = "mt5_runner.cli:main"

[project.urls]
Homepage = "https://github.com/XScryer/mt5-backtest-runner"
Repository = "https://github.com/XScryer/mt5-backtest-runner"
Issues = "https://github.com/XScryer/mt5-backtest-runner/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mt5_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
